[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "Air quality in nairobi"
version = "0.0.1"
description = "This project 
is part of an exploratory data analysis of low-cost air quality 
monitoring systems using open environmental data."
authors = [
  { name = "Mohamed Mohsen" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.4.14"


[tool.ruff]
line-length = 99
src = ["n"]
include = ["pyproject.toml", "n/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["n"]
force-sort-within-sections = true

